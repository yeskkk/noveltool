<main><section class="intro"><h2>增量设定同步</h2><p>已确认正文不因分析失败而回滚。复用整个原输入仍有效的观察，只分析缺少的范围；结果可在设定页核对。</p></section><div id="message" class="message" role="status"></div><section class="card"><h3 id="coverage"></h3><p id="counts"></p><p id="notice" class="hint"></p><button id="start-sync" class="primary">同步当前正文 / 重试未完成部分</button><button id="pause-sync">当前请求完成后暂停</button><button id="refresh-sync">刷新状态</button><p id="job"></p><p class="hint">默认使用最近分块参数。需要较小块或更低输出预留时，可先在“导入与分块”调整计划。重启不自动发请求，点击同步才继续。覆盖完成不是内容正确的保证，尤其需要核对倒叙、梦境、计划和返修后的因果关系。</p><a href="/settings">核对设定与待审结果</a></section></main><footer>旧证据可追溯 · 同步与正文事务分离 · 失败可恢复</footer></body></html>
