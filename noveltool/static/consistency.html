<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovelTool · 后文一致性检查</title><link rel="stylesheet" href="/static/app.css"><script src="/static/workspace.js" defer></script><script src="/static/consistency.js" defer></script></head><body>
<header class="topbar"><div><div class="eyebrow">LOCAL NOVEL WORKSPACE</div><h1>NovelTool <span>v{{VERSION}}</span></h1></div><nav><a href="/manuscript">正文</a><a href="/import">导入与分块</a><a href="/analysis">分析</a><a href="/sync">设定同步</a><a href="/consistency" aria-current="page">一致性检查</a><a href="/maintenance">项目维护</a><a href="/settings">设定</a><a href="/timeline">时间线</a><a href="/ideas">构思</a><a href="/context">状态/上下文</a><a href="/generation">续写/返修</a><a href="/model">模型测试</a><a href="/">项目设置</a></nav></header>
<main><section class="intro"><h2>返修后的后文一致性</h2><p>比较修改前后的原文，逐块核对后文。每条提醒必须引用真实文本；它们是待核对意见，不会自动改正文，也不会写成人物事实。</p></section><div id="message" class="message" role="status"></div><section class="card"><p id="revision-info"></p><label>每次检查输出预留<input id="output-reserve" type="number" value="1536" min="256" max="8192"></label><button id="start-check" class="primary">检查最新返修的后文</button><button id="refresh-check">重新载入</button><p class="hint">保留完整修改前后选区，每次只提供一块后文。它不是全书全要素的逻辑证明，不会跨多个块自行建立无限记忆；分散在多个块的复杂矛盾仍可能遗漏。</p><div id="history"></div></section><section id="results" class="card" hidden><h3 id="job-info"></h3><p id="job-error" class="hint"></p><button id="resume-check">继续未完成单元</button><button id="pause-check">当前单元后暂停</button><details><summary>本次比较的原文</summary><h4>修改前</h4><pre id="change-before" class="wrapped"></pre><h4>修改后</h4><pre id="change-after" class="wrapped"></pre></details><details><summary>单元进度与原始输入</summary><div id="units"></div><pre id="input" class="wrapped"></pre></details><label>问题筛选<select id="issue-filter"><option value="all">全部</option><option value="open">待核对</option><option value="resolved">已处理</option><option value="ignored">已忽略</option></select></label><div id="issues"></div></section></main><footer>有证据的提醒，不是自动裁决 · 检查覆盖与语义正确分开显示</footer></body></html>
