[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noveltool"
version = "0.6.0"
description = "Local-first novel editing assistant with immutable revisions and validated model boundaries"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
noveltool = "noveltool.__main__:main"

[tool.setuptools.packages.find]
include = ["noveltool*"]

[tool.setuptools.package-data]
noveltool = ["sql/*.sql", "static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
